# Render Blueprint: New > Blueprint, pick this repo, then fill in the three secrets when asked.
services:
  - type: web
    name: payguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash render_start.sh
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PAYPAL_RETURN_TO
        value: dashboard
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: anthropic/claude-haiku-5.5
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
